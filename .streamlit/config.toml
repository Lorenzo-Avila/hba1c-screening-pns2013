# O painel roda sem rede: sem telemetria e sem fonte ou tema carregado de fora.
[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Só localhost: sem escutar na rede e sem consultar o IP externo na partida.
[server]
address = "localhost"

# Mesma paleta de painel/estilo.py. A fonte é a pilha do sistema, nada é baixado.
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
font = "Inter, 'Segoe UI', system-ui, sans-serif"
headingFont = "Inter, 'Segoe UI', system-ui, sans-serif"
baseRadius = "0.75rem"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
